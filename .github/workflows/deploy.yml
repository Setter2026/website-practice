name: Platform Deployment Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Sarah's Code
        uses: actions/checkout@v4

      # --- NEW STEP: Log into your Docker Hub account securely ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Setup Docker Factory
        uses: docker/setup-buildx-action@v3

      # --- UPDATED STEP: Build AND automatically upload (push) to the cloud ---
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Replace 'your-dockerhub-username' below with your actual Docker Hub name
          tags: seterr/sarah-app:latest
      
      - name: Trigger Automatic CD Deployment on Render
        run: | 
          curl -X PASTE "Trigger Automatic CD Deployment on Render"
